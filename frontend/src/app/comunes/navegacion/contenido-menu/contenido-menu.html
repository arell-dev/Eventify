<div class="contenido-menu d-flex flex-column justify-content-between gap-4 p-4">
  <div class="d-flex flex-column gap-4">
    <div class="marca-menu d-flex flex-column align-items-start gap-1">
      <img src="/utp.svg" alt="UTP" width="104" height="32">
      <span>Eventos UTP · Administración</span>
    </div>
    <nav aria-label="Navegación administrativa">
      <ul class="nav flex-column gap-1">
        @for (entrada of entradas; track entrada.ruta) {
          <li class="nav-item">
            <ng-template #etiqueta>
              <svg class="icono-menu" viewBox="0 0 24 24" aria-hidden="true">
                <path [attr.d]="entrada.icono"></path>
              </svg>
              <span>{{ entrada.nombre }}</span>
            </ng-template>
            @if (entrada.disponible) {
              <a class="nav-link enlace-modulo d-flex align-items-center gap-2 rounded-2 px-3" [routerLink]="entrada.ruta" routerLinkActive="enlace-activo" ariaCurrentWhenActive="page" (click)="enlaceSeleccionado.emit()">
                <ng-container [ngTemplateOutlet]="etiqueta"></ng-container>
              </a>
            } @else {
              <span class="nav-link enlace-modulo d-flex align-items-center gap-2 rounded-2 px-3" role="link" aria-disabled="true">
                <ng-container [ngTemplateOutlet]="etiqueta"></ng-container>
              </span>
            }
          </li>
        }
      </ul>
    </nav>
  </div>

  <div class="d-flex flex-column gap-2 border-top pt-3">
    <a class="enlace-catalogo d-flex align-items-center justify-content-between gap-2 rounded-2 px-3 py-2 text-decoration-none" routerLink="/eventos" (click)="enlaceSeleccionado.emit()">
      <span>Ver catálogo público</span>
      <svg class="icono-catalogo" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M13 5h6v6m0-6-8 8m-1-7H5v13h13v-5"></path>
      </svg>
    </a>
    <div class="datos-sesion d-flex align-items-center justify-content-between gap-2 rounded-2">
      <div class="identidad-sesion d-flex flex-column">
        <strong>{{ usuario() }}</strong>
        <span>Sesión activa</span>
      </div>
      <button class="btn boton-salida p-0 rounded-2" type="button" aria-label="Cerrar sesión" [disabled]="cerrandoSesion()" (click)="salidaSolicitada.emit()">
        <svg class="icono-menu" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 17l5-5-5-5m-6 5h11m-1-8h6v16h-6"></path>
        </svg>
      </button>
    </div>
  </div>
</div>
